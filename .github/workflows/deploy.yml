name: Deploy celestial archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celestial-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install literary dossier dependencies
        working-directory: petersburg-dossier
        run: npm ci
      - name: Build literary dossier
        working-directory: petersburg-dossier
        run: npm run build
      - name: Include dossier at its own URL
        run: cp -a petersburg-dossier/dist dist/petersburg-dossier
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist
          retention-days: 1
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist
      - name: Publish the verified build
        working-directory: site
        run: |
          rsync -a --delete --exclude='.git' ../dist/ ./
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
